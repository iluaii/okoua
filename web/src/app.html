<!doctype html>
<html lang="uk">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)" />
		<meta name="description" content="Карта повітряних тривог, графіки відключень світла та новини вашої області." />
		<!-- Link preview in messengers; crawlers need absolute URLs. -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Око" />
		<meta property="og:locale" content="uk_UA" />
		<meta property="og:title" content="Око: тривоги, світло й новини з ШІ" />
		<meta property="og:description" content="Тривоги наживо по районах, графіки світла по чергах і новини вашої області з коротким переказом ШІ. Безкоштовно, без реєстрації." />
		<meta property="og:url" content="https://okoua.pp.ua/" />
		<meta property="og:image" content="https://okoua.pp.ua/og.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Око: карта тривог на телефоні" />
		<meta name="twitter:card" content="summary_large_image" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Око" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
